<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gestione Vita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app mobile-first a colonna (max 680px, due colonne su desktop), header con saluto, barra emoji in basso, "+" flottante. Ogni sezione ha il suo colore (--sec); verde/arancio/rosso solo per gli stati. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#EDF0F5; --fg:#141922; --muted:#5E6878; --line:#DFE4EC;
  --c-oggi:#2563EB; --c-pasti:#D63E78; --c-casa:#0F9488; --c-soldi:#5A49D6; --c-altro:#4B5868;
  --sec:var(--c-oggi);
  --ok:#15924A; --ok-soft:#DDF4E6; --warn:#C76A06; --warn-soft:#FDEBD3; --bad:#D42F2F; --bad-soft:#FCE1E1;
  --shadow:0 1px 2px rgba(20,25,34,.05),0 6px 18px rgba(20,25,34,.06);
  --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1218; --surface:#171D27; --surface-2:#212937; --fg:#E9EDF4; --muted:#9AA4B5; --line:#2A3443;
  --c-oggi:#7EA6FF; --c-pasti:#FF84B0; --c-casa:#4FD3C4; --c-soldi:#A99DFF; --c-altro:#A3B1C2;
  --ok:#4CCB86; --ok-soft:#163222; --warn:#F3A54E; --warn-soft:#3A2913; --bad:#FF7B7B; --bad-soft:#3E1B1B;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#171D27; --surface-2:#212937; --fg:#E9EDF4; --muted:#9AA4B5; --line:#2A3443;
  --c-oggi:#7EA6FF; --c-pasti:#FF84B0; --c-casa:#4FD3C4; --c-soldi:#A99DFF; --c-altro:#A3B1C2;
  --ok:#4CCB86; --ok-soft:#163222; --warn:#F3A54E; --warn-soft:#3A2913; --bad:#FF7B7B; --bad-soft:#3E1B1B;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
body[data-sec="veicoli"]{--sec:#0B7FC1} body[data-sec="progetti"]{--sec:#B26A00} body[data-sec="chat"]{--sec:var(--c-oggi)} body[data-sec="revisione"]{--sec:var(--c-pasti)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-sec="veicoli"]{--sec:#5BBDF5} :root:not([data-theme="light"]) body[data-sec="progetti"]{--sec:#F2C05E}}
:root[data-theme="dark"] body[data-sec="veicoli"]{--sec:#5BBDF5} :root[data-theme="dark"] body[data-sec="progetti"]{--sec:#F2C05E}
body[data-sec="oggi"]{--sec:var(--c-oggi)} body[data-sec="pasti"]{--sec:var(--c-pasti)} body[data-sec="casa"]{--sec:var(--c-casa)} body[data-sec="soldi"]{--sec:var(--c-soldi)} body[data-sec="altro"]{--sec:var(--c-altro)}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--sec);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}
.e{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}

.app{max-width:680px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (min-width:1000px){.app{max-width:1040px}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .date{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);font-weight:700}
.top h1{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}

/* layout */
.view{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;gap:14px}
@media (min-width:1000px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h2{font-family:var(--font-display);font-size:19px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.badge{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;background:color-mix(in srgb,var(--sec) 14%,transparent);flex:none}
.sub{font-size:13px;color:var(--muted)}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
hr.sep{border:0;border-top:1px solid var(--line);margin:10px 0}
.sec-title{font-family:var(--font-display);font-size:22px;font-weight:700;margin:0}
.daylabel{margin:6px 0 2px;display:flex;align-items:center;gap:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.btn:hover{border-color:var(--sec)}
.btn.primary{background:var(--sec);color:#fff;border-color:var(--sec)}
:root[data-theme="dark"] .btn.primary{color:#0D1117}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0D1117}}
.btn.soft{background:color-mix(in srgb,var(--sec) 13%,transparent);border-color:transparent;color:var(--fg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sec);padding:0 8px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:0 10px;white-space:nowrap;min-height:42px;border:0;border-radius:11px;background:transparent;font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--sec);box-shadow:var(--shadow)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);min-height:54px}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item.done .em{opacity:.45}
.em{font-size:22px;width:32px;text-align:center;flex:none}
.tap{cursor:pointer}

/* check */
.chk{width:32px;height:32px;flex:none;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:transparent;transition:background .15s,border-color .15s}
.chk svg{width:18px;height:18px;stroke-width:3.2}
.chk[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .25s ease-out}
.chk.lg{width:34px;height:34px}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* pills & chips */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:color-mix(in srgb,var(--sec) 14%,transparent);color:var(--sec)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.ings{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ing{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;border:0;min-height:32px}
.ing.ok{background:var(--ok-soft);color:var(--ok)}
.ing.warn{background:var(--warn-soft);color:var(--warn)}
.ing.bad{background:var(--bad-soft);color:var(--bad);cursor:pointer}
.stripe{width:5px;align-self:stretch;border-radius:4px;background:var(--line);flex:none}
.stripe.ok{background:var(--ok)}.stripe.warn{background:var(--warn)}.stripe.bad{background:var(--bad)}

/* agenda */
.ev{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.ev:first-of-type{border-top:0}
.ev .when{font-weight:800;font-size:14px;color:var(--sec)}
.ev .what{font-weight:600;overflow-wrap:anywhere}

/* meals */
.meal{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.meal:first-child{border-top:0}
.meal .em{padding-top:2px}
.meal .slot{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--sec)}
.meal .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daystrip button{border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:15px;color:var(--fg)}
.daystrip button small{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.daystrip button[aria-pressed="true"]{background:var(--sec);color:#fff}
.daystrip button[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.daystrip button.today:not([aria-pressed="true"]){outline:2px solid var(--sec);outline-offset:-2px}

/* money */
.big{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:118px;height:118px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv .k{font-size:13px;color:var(--muted)}
.kv .v{font-weight:800;font-size:18px}
.bar{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:6px;background:var(--sec)}
.bar>span.warn{background:var(--warn)}.bar>span.bad{background:var(--bad)}.bar>span.ok{background:var(--ok)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0}
.catrow .bar{grid-column:1/-1}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cat .e{font-size:24px}
.cat .n{font-size:13px;color:var(--muted);font-weight:600}
.cat .v{font-weight:800}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* empty & notices */
.empty{padding:14px 4px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .e{font-size:34px}
.notice{background:var(--warn-soft);color:var(--fg);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notice svg{color:var(--warn);margin-top:1px}
.notice.info{background:color-mix(in srgb,var(--sec) 12%,transparent)}.notice.info svg{color:var(--sec)}
.notice.err{background:var(--bad-soft)}.notice.err svg{color:var(--bad)}
.party{background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:10px 12px;font-weight:700;text-align:center}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.in{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;font-size:16px;width:100%}
textarea.in{min-height:96px;resize:vertical}
.in:focus{border-color:var(--sec);outline:none}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--sec);border-color:var(--sec);color:#fff}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .in{flex:1;min-width:0}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.pick button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:12.5px}
.pick button .e{font-size:26px}
.pick button[aria-pressed="true"]{border-color:var(--sec);background:color-mix(in srgb,var(--sec) 12%,transparent);color:var(--sec)}
.grid-chips{display:flex;flex-wrap:wrap;gap:8px}
.gchip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px;min-height:42px;background:var(--surface-2)}
.gchip.low{background:var(--warn-soft);color:var(--warn)}
.gchip.inl{background:color-mix(in srgb,var(--sec) 13%,transparent);color:var(--sec)}

/* ai */
.ai-out{white-space:pre-wrap;background:var(--surface-2);border-radius:14px;padding:12px;font-size:15px;min-height:60px;overflow-wrap:anywhere}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--sec);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in-nav{max-width:760px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.nav .in-nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;min-width:68px;scroll-snap-align:start;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px;min-height:56px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:700}
@media (min-width:760px){.nav .in-nav{-webkit-mask-image:none;mask-image:none;justify-content:center}}
.nav button .e{font-size:22px;filter:grayscale(.6);opacity:.75}
.nav button[aria-current="page"]{color:var(--sec);background:color-mix(in srgb,var(--sec) 12%,transparent)}
.nav button[aria-current="page"] .e{filter:none;opacity:1}
.fab{position:fixed;z-index:26;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(86px + env(safe-area-inset-bottom,0px));
  width:62px;height:62px;border-radius:50%;border:0;background:var(--sec);color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--sec) 45%,transparent);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:30px;height:30px;stroke-width:2.6}
@media (min-width:1000px){.fab{right:max(18px,calc(50% - 520px))}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;max-height:84vh}}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h3{font-family:var(--font-display);font-size:22px;margin:0}

/* toast */
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);border-radius:16px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15px;font-weight:600}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:800;min-height:40px;padding:0 12px;border-radius:10px;text-decoration:underline}

/* altro */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 10px;border:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.tile .e{font-size:34px}
.tile .tt{font-weight:800;font-size:15px}
.disclaimer{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"›";margin-left:auto;font-size:22px;color:var(--muted);transition:transform .15s}
details[open] summary::after{transform:rotate(90deg)}
.ai-sw{flex:none;width:58px;height:34px;border-radius:999px;border:0;background:var(--line);position:relative;transition:background .2s}
.ai-sw span{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.ai-sw[aria-checked="true"]{background:var(--ok)}
.ai-sw[aria-checked="true"] span{transform:translateX(24px)}
.dest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dest button{--dc:var(--sec);border:2px solid color-mix(in srgb,var(--dc) 45%,transparent);background:color-mix(in srgb,var(--dc) 13%,var(--surface));color:var(--fg);border-radius:18px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:15px}
.dest button .e{font-size:30px}

<script>
"use strict";
/* ===================== helpers ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dowOf = d => ((d.getDay() + 6) % 7) + 1; // 1 = lunedì
const daysBetween = (a, b) => Math.round((parseD(ymd(a)) - parseD(ymd(b))) / 864e5);
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const eur = n => (n == null || isNaN(n)) ? "—" : Number(n).toLocaleString("it-IT", { style: "currency", currency: "EUR" });
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const icon = (n, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const DOW = ["", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];
const DOW_S = ["", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];
const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
const fmtDate = d => `${d.getDate()} ${MESI[d.getMonth()]}`;
const fmtDateY = d => `${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`;
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const relDays = n => n === 0 ? "oggi" : n === 1 ? "domani" : n === -1 ? "ieri" : n < 0 ? `${-n} giorni fa` : `tra ${n} giorni`;
const REPARTI = ["Frutta e verdura", "Carne e pesce", "Latticini e uova", "Pane e cereali", "Dispensa", "Surgelati", "Bevande", "Casa e pulizia", "Altro"];
const CATS = [
  { id: "carburante", name: "Carburante" },
  { id: "spesa", name: "Spesa alimentare" },
  { id: "personali", name: "Uscite e cibo fuori" },
  { id: "casa", name: "Casa (extra)" },
  { id: "veicoli", name: "Auto e moto (extra)" },
  { id: "salute", name: "Salute" },
  { id: "altro", name: "Altro" },
];
const catName = id => CATS.find(c => c.id === id)?.name || "Altro";
const PREFIXES = ["CASA", "SPESA", "LAVORO", "PROGETTO", "SCADENZA", "STUDIO", "PERSONALE"];

/* ===================== store ===================== */
const DEFAULTS = {
  profile: { name: "" },
  meals: { plan: {}, recipes: [], estimate: null, note: "" },
  shopping: { items: [] },
  pantry: { items: [] },
  house: { tasks: [], laundry: [], products: [] },
  money: { budget: { income: 0, lines: [] }, deadlines: [], subs: [], goals: [] },
  priorities: { date: "", items: [] },
  notes: { items: [] },
  drive: {},
  drivefile: {},
  vehicles: { list: [], history: [] },
  history: { items: [] },
  settings: { ai: false },
  prices: { items: {} },
};
const store = { docs: {}, mode: "loading", loaded: false, err: "" };
let db = null, col = null, userId = null;
const writing = {}, pendingBody = {};

function getDoc(id) {
  if (store.docs[id]) return store.docs[id];
  if (id.startsWith("exp-")) return { items: [] };
  return DEFAULTS[id];
}
function mut(id, fn) {
  const d = structuredClone(getDoc(id));
  fn(d);
  store.docs[id] = d;
  schedule();
  persist(id, d);
}
async function persist(id, body) {
  if (store.mode === "local") {
    try {
      localStorage.setItem("gv:" + id, JSON.stringify(body));
      const idx = new Set(JSON.parse(localStorage.getItem("gv:index") || "[]")); idx.add(id);
      localStorage.setItem("gv:index", JSON.stringify([...idx]));
    } catch { }
    return;
  }
  if (store.mode !== "db") return;
  pendingBody[id] = body;
  if (writing[id]) return;
  writing[id] = true; setSync();
  try {
    while (pendingBody[id]) {
      const b = pendingBody[id]; delete pendingBody[id];
      try { await col.doc(id).set(b); store.err = ""; }
      catch (e) {
        if (e?.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); try { await col.doc(id).set(b); store.err = ""; continue; } catch (e2) { e = e2; } }
        store.err = dbMsg(e); toast(store.err);
      }
    }
  } finally { writing[id] = false; setSync(); }
}
function dbMsg(e) {
  switch (e?.code) {
    case "quota_exceeded": return "Spazio dati pieno: elimina note o spese vecchie, poi riprova.";
    case "resource_exhausted": return "Troppe modifiche di fila: aspetta qualche secondo e riprova.";
    case "invalid_argument": return "Salvataggio rifiutato: dato non valido o permesso di scrittura assente.";
    case "revoked": return "Accesso ai dati revocato: ricarica l'app.";
    default: return "Salvataggio non riuscito: controlla la connessione. La modifica resta su questo schermo finché non ricarichi.";
  }
}
function setSync() {
  const el = $("#sync"); if (!el) return;
  let cls = "", txt = "";
  if (store.mode === "loading") { txt = "Avvio…"; }
  else if (store.mode === "db") {
    const busy = Object.values(writing).some(Boolean);
    if (store.err) { cls = "bad"; txt = "Errore salvataggio"; }
    else if (busy) { cls = "warn"; txt = "Salvo…"; }
    else { cls = "ok"; txt = ""; }
  } else if (store.mode === "local") { cls = "warn"; txt = "Solo locale"; }
  else { cls = "bad"; txt = "Dati non disponibili"; }
  el.innerHTML = `<span class="dot ${cls}" title="${cls === "ok" ? "Sincronizzato" : esc(txt)}"></span>${txt ? `<span>${txt}</span>` : ""}`;
}

/* ===================== ui state ===================== */
const ui = {
  tab: "oggi", pasti: "piano", casa: "faccende", soldi: "mese", altro: "",
  month: monthKey(today()), noteQ: "", open: {}, lastRep: "Altro",
};
try { const s = JSON.parse(localStorage.getItem("gv:ui") || "{}"); Object.assign(ui, s, { open: s.open || {}, pasti: ["piano", "spesa", "dispensa", "kcal"].includes(s.pasti) ? s.pasti : "piano", month: monthKey(today()), altro: ["note", "permessi", "drive", "impostazioni", "storia"].includes(s.altro) ? s.altro : "", tab: TABS.some(t => t.id === s.tab) ? s.tab : "oggi" }); } catch { }
function saveUi() { try { localStorage.setItem("gv:ui", JSON.stringify({ tab: ui.tab, pasti: ["piano", "spesa", "dispensa", "kcal"].includes(ui.pasti) ? ui.pasti : "piano", altro: ui.altro, open: ui.open, lastRep: ui.lastRep })); } catch { } }

let rq = 0;
function schedule() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }

/* ===================== capabilities ===================== */
let sample = null, mcp = null, perms = null;
let sampleCap, sampleReq = false; // sampleCap: namespace (richiesto solo con Assistente AI acceso)
const aiOn = () => !!(getDoc("settings") || {}).ai;
function applyAi() {
  if (!aiOn()) { sample = null; return; }
  if (sampleCap !== undefined) { sample = sampleCap; return; }
  if (sampleReq || !window.claude?.use) return;
  sampleReq = true;
  window.claude.use("sample").then(s => { sampleCap = s || null; sample = aiOn() ? sampleCap : null; schedule(); }).catch(() => { sampleCap = null; });
}
const CAL = "Google Calendar";
const CLAUDE_CAL = "Vita personale [CLAUDE]";
const cal = { status: "idle", events: [], error: "", partial: "", calendars: [], claudeId: null, loadedAt: 0, perm: "unknown" };

function mcpMsg(e) {
  switch (e?.code) {
    case "needs_reauth": return "Google Calendar va ricollegato: claude.ai → Impostazioni → Connettori.";
    case "server_not_connected": return "Google Calendar non è collegato: aggiungilo da claude.ai → Impostazioni → Connettori.";
    case "selection_required": return "Hai più connettori Google Calendar: scegli quale usare nella finestra di claude.ai.";
    case "not_in_manifest": return "L'accesso al calendario è stato negato per questa app. Riattivalo da Altro → Stato permessi.";
    case "blocked_by_policy": return "La tua organizzazione blocca questo strumento del calendario.";
    case "approval_required": return "Serve la tua approvazione per usare il calendario.";
    case "server_unavailable": return "Google Calendar non risponde in questo momento. Riprova tra poco.";
    case "not_granted": case "capability_disabled": case "capability_removed": return "Il calendario non è disponibile in questa vista. Apri l'app da claude.ai o dall'app Claude.";
    case "tool_error": return "Google Calendar ha restituito un errore: " + (e.message || "").slice(0, 140);
    default: return "Errore del calendario. Riprova con il pulsante aggiorna.";
  }
}
function aiMsg(e) {
  switch (e?.code) {
    case "not_granted": return "Non hai autorizzato l'app a usare Claude. Puoi abilitarlo da Altro → Stato permessi.";
    case "sampling_disabled": return "Claude non è disponibile per questo account.";
    case "rate_limited": return "Limite di utilizzo raggiunto. Riprova più tardi.";
    case "session_expired": return "Sessione scaduta: accedi di nuovo a claude.ai.";
    case "refused": return "Claude ha rifiutato questa richiesta. Riformulala.";
    case "invalid_json": return "La risposta di Claude non era nel formato atteso. Premi di nuovo per riprovare.";
    case "empty_completion": return "Claude non ha prodotto una risposta. Riprova con una richiesta più semplice.";
    case "prompt_too_large": return "Troppi dati da inviare: svuota un po' la dispensa o la lista e riprova.";
    case "cancelled": return "Interrotto.";
    case "not_declared": case "capability_disabled": case "capability_removed": return "Claude non è disponibile in questa vista.";
    default: return "Claude non ha risposto (errore temporaneo). Riprova.";
  }
}

/* ===================== domain logic ===================== */
// Scadenze: prossima occorrenza e stato
function deadlineOccurrence(dl, ref = today()) {
  if (dl.kind === "monthly") {
    const mk = monthKey(ref);
    const dim = (y, m) => new Date(y, m + 1, 0).getDate();
    const thisOcc = new Date(ref.getFullYear(), ref.getMonth(), Math.min(dl.day, dim(ref.getFullYear(), ref.getMonth())));
    if (dl.until && mk > dl.until) return null;
    if (dl.paid?.[mk]) {
      const nx = new Date(ref.getFullYear(), ref.getMonth() + 1, Math.min(dl.day, dim(ref.getFullYear(), ref.getMonth() + 1)));
      if (dl.until && monthKey(nx) > dl.until) return { date: thisOcc, key: mk, paid: true, last: true };
      return { date: nx, key: monthKey(nx), paid: false, prevPaid: true, paidKey: mk, paidDate: thisOcc };
    }
    return { date: thisOcc, key: mk, paid: false };
  }
  if (!dl.date) return null;
  return { date: parseD(dl.date), key: dl.date, paid: false };
}
function statusOf(occ) {
  if (!occ) return { cls: "", label: "—" };
  if (occ.paid) return { cls: "ok", label: "Pagato ✓" };
  const n = daysBetween(occ.date, today());
  if (n < 0) return { cls: "bad", label: n === -1 ? "Scaduto ieri" : `Scaduto da ${-n} gg` };
  if (n === 0) return { cls: "bad", label: "Oggi" };
  if (n <= 7) return { cls: "warn", label: n === 1 ? "Domani" : `Tra ${n} gg` };
  return { cls: "", label: n <= 60 ? `Tra ${n} gg` : fmtDate(occ.date) };
}
function upcomingDeadlines(withinDays) {
  const m = getDoc("money"); const t = today(); const out = [];
  for (const dl of m.deadlines || []) {
    const occ = deadlineOccurrence(dl, t); if (!occ || occ.paid) continue;
    const n = daysBetween(occ.date, t);
    if (n <= withinDays) out.push({ dl, occ, n, auto: false });
  }
  for (const s of m.subs || []) {
    let d = new Date(t.getFullYear(), t.getMonth(), s.day);
    if (d < t) d = new Date(t.getFullYear(), t.getMonth() + 1, s.day);
    const n = daysBetween(d, t);
    if (n <= withinDays) out.push({ sub: s, occ: { date: d }, n, auto: true });
  }
  return out.sort((a, b) => a.n - b.n);
}

// Faccende
function taskState(t, ref = today()) {
  const tk = ymd(ref);
  if (t.freq === "daily") {
    const done = t.lastDone === tk;
    return { due: true, today: true, done, overdue: false, next: ref };
  }
  if (t.freq === "weekly") {
    const back = (dowOf(ref) - t.dow + 7) % 7;
    const occ = addDays(ref, -back);
    const done = t.lastDone && t.lastDone >= ymd(occ);
    const isToday = back === 0;
    const overdue = !done && back > 0 && back <= 2 && !!t.lastDone;
    const next = done || back > 3 ? addDays(occ, 7) : occ;
    return { due: isToday || overdue, today: isToday, done, overdue, next: done && isToday ? addDays(occ, 7) : next, occ };
  }
  if (t.freq === "once") {
    const next = t.next ? parseD(t.next) : ref;
    const n = daysBetween(next, ref);
    const done = !!t.lastDone;
    return { due: (n <= 0 && !done) || t.lastDone === tk, today: n === 0, done, overdue: n < 0 && !done, next, n, hide: done && t.lastDone < tk };
  }
  // interval
  const next = t.next ? parseD(t.next) : ref;
  const n = daysBetween(next, ref);
  const doneToday = t.lastDone === tk;
  return { due: n <= 0 || doneToday, today: n === 0, done: doneToday, overdue: n < 0 && !doneToday, next, n };
}
function completeTask(t) {
  const prev = structuredClone(t);
  const tk = ymd(today());
  mut("house", h => {
    const x = h.tasks.find(y => y.id === t.id); if (!x) return;
    if (x.freq === "once") { x.lastDone = x.lastDone ? null : tk; return; }
    if (x.freq === "interval") {
      const st = taskState(x);
      if (st.done) { x.lastDone = x.prevLast || null; x.next = x.prevNext || x.next; delete x.prevLast; delete x.prevNext; return; }
      x.prevLast = x.lastDone || null; x.prevNext = x.next || null;
      x.lastDone = tk; x.next = ymd(addDays(today(), x.every || 30));
    } else {
      const st = taskState(x);
      if (st.done) { x.lastDone = x.prevLast || null; delete x.prevLast; }
      else { x.prevLast = x.lastDone || null; x.lastDone = tk; }
    }
  });
  return prev;
}
function laundryState(l, ref = today()) {
  const back = (dowOf(ref) - l.dow + 7) % 7;
  const occ = addDays(ref, -back);
  const every = l.everyWeeks || 1;
  let active = true;
  if (every > 1 && l.anchor) { const w = Math.round(daysBetween(occ, parseD(l.anchor)) / 7); active = ((w % every) + every) % every === 0; }
  const done = l.lastDone && l.lastDone >= ymd(occ);
  return { today: back === 0 && active, done, active, occ };
}

// Budget
function linesForMonth(mk) {
  const b = getDoc("money").budget || { lines: [] };
  return (b.lines || []).filter(l => (!l.from || mk >= l.from) && (!l.to || mk <= l.to));
}
function monthSummary(mk) {
  const b = getDoc("money").budget || {};
  const lines = linesForMonth(mk);
  const exp = getDoc("exp-" + mk).items || [];
  const sum = g => lines.filter(l => l.group === g).reduce((s, l) => s + (+l.amount || 0), 0);
  const fixed = sum("fisse"), varBudget = sum("variabili"), savings = sum("accantonamenti");
  const spent = exp.reduce((s, e) => s + (+e.amount || 0), 0);
  const byCat = {};
  for (const e of exp) byCat[e.cat] = (byCat[e.cat] || 0) + (+e.amount || 0);
  const income = +b.income || 0;
  return { income, fixed, varBudget, savings, spent, byCat, lines, exp, left: income - fixed - savings - spent, planned: income - fixed - savings - varBudget };
}

const normTxt = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();

const BASICS = ["olio", "sale", "pepe", "aceto", "acqua", "spezie", "erbe", "origano", "rosmarino", "aglio", "limone", "zucchero", "farina"];
const STOP = new Set(["di", "del", "dei", "della", "delle", "con", "al", "alla", "allo", "per", "in", "g", "kg", "ml", "gr", "lt", "cucchiai", "cucchiaio", "scatoletta", "scatolette", "confezione", "pezzi", "fette", "fresco", "fresca", "freschi", "fresche", "o", "e", "simile", "misto", "miste", "misti", "naturale", "qb", "un", "una", "uno", "facoltativa", "facoltativo"]);
const stemW = w => (w.length > 4 ? w.replace(/[aeio]$/, "") : w);
const keyWords = s => normTxt(s).split(" ").filter(w => w.length > 2 && !STOP.has(w)).map(stemW);
function isBasic(ing) { const k = keyWords(ing); return k.length > 0 && k.every(w => BASICS.some(b => stemW(b) === w)); }
function matchIn(ing, names) { const k = keyWords(ing); if (!k.length) return true; return names.some(n => { const nk = keyWords(n); return k.some(w => nk.includes(w)); }); }
function mealIngredients(m) {
  if (Array.isArray(m?.ing) && m.ing.length) return m.ing;
  if (m?.r) { const r = (getDoc("meals").recipes || []).find(x => x.id === m.r); if (r) return (r.ingredients || []).map(i => i.replace(/\s*\d.*$/, "").trim()).filter(Boolean); }
  return [];
}
function ingredientStatus(m) {

  const list = (getDoc("shopping").items || []).filter(i => !i.checked).map(i => i.name);

}

const REP_KW = [["Carne e pesce", /pollo|tacchino|merluzz|pesce|salmone|orata|carne|manzo|bistecc|hamburger|prosciutt/], ["Latticini e uova", /uov|yogurt|latte|fiocchi|formagg|mozzarell|ricotta|burro/], ["Pane e cereali", /riso|pasta|pane|farro|avena|cereali|cracker/], ["Surgelati", /surgelat/], ["Dispensa", /tonno|olio|sale|pepe|spezie|legum|ceci|fagiol|lentic|aceto|passata|scatol/], ["Frutta e verdura", /patat|insalat|lattuga|zucchin|verdur|pomodor|frutta|mela|banan|carot|peperon|limone|cipoll|spinac|broccol/]];
function guessRep(name) { const t = normTxt(name); for (const [rep, re] of REP_KW) if (re.test(t)) return rep; return "Altro"; }
function completeFromMenu() {
  const m = getDoc("meals"); const pantry = (getDoc("pantry").items || []).map(i => i.name);
  const list = (getDoc("shopping").items || []).filter(i => !i.checked).map(i => i.name); const need = [];

/* ===================== OGGI ===================== */
function todoFor(d) {
  const h = getDoc("house"); const isToday = ymd(d) === ymd(today()); const out = [];
  for (const x of h.tasks || []) {
    const st = taskState(x, d); if (st.hide) continue;
    let hit = false;
    if (x.freq === "daily") hit = isToday;
    else if (x.freq === "weekly") hit = x.dow === dowOf(d) || (isToday && st.overdue);
    else hit = x.next === ymd(d) || (isToday && st.overdue) || (isToday && x.lastDone === ymd(d));
    if (!hit) continue;
    let title = x.title;
    if (x.kind === "spesa") { const n = (getDoc("shopping").items || []).filter(i => !i.checked).length; if (n) title += ` · ${n} ${n === 1 ? "prodotto" : "prodotti"}`; }
    out.push({ act: "task-toggle", id: x.id, title, emoji: emo("chore", x.title, "✅"), done: isToday && st.done, late: isToday && st.overdue, min: x.minutes });
  }
  for (const l of h.laundry || []) { const st = laundryState(l, d); if (st.today) out.push({ act: "laundry-toggle", id: l.id, title: `Lavatrice · ${l.type}`, emoji: "🧺", done: isToday && st.done, min: null, meta: l.temp }); }
  for (const dl of getDoc("money").deadlines || []) {
    const occ = deadlineOccurrence(dl, today()); if (!occ || occ.paid) continue;
    const n = daysBetween(occ.date, d);
    if (n === 0 || (isToday && n < 0)) out.push({ deadline: true, id: dl.id, title: dl.title + (dl.amount != null ? " · " + eur(dl.amount) : ""), emoji: emo("deadline", dl.title, "📌"), late: n < 0 });
  }
  return out.sort((a, b) => (a.done - b.done) || ((b.late ? 1 : 0) - (a.late ? 1 : 0)));
}
function viewOggi() {
  return `<div class="grid2"><div class="col">${cardImpegni()}${cardDaFare()}</div><div class="col">${cardPasti()}</div></div>`;
}
function cardImpegni() {

  else if (cal.status === "idle") body = cal.perm === "denied" ? `<button class="btn soft block" data-act="perm-manage">🔐 Riattiva il calendario</button>` : `<button class="btn soft block" data-act="cal-load">📅 Mostra impegni</button>`;
  else if (cal.status === "loading" && !cal.events.length) body = `<span class="thinking"><span class="spinner"></span>Leggo il calendario…</span>`;
  else if (cal.status === "error") body = `<div class="notice err">${icon("alert", "sm")}<div>${esc(cal.error)}</div></div><button class="btn soft" data-act="cal-load" style="margin-top:8px">🔄 Riprova</button>`;
  else {
    const t = today();
    const list = d => { const l = cal.events.filter(e => ymd(e.day) === ymd(d)); return l.length ? l.map(e => `<div class="ev"><div class="when num">${e.allDay ? "tutto il g." : fmtTime(e.start)}</div><div class="what">${esc(e.title)}</div></div>`).join("") : `<div class="sub" style="padding:4px 0 6px">🌤️ Libero</div>`; };
    body = `<div class="label daylabel">Oggi</div>${list(t)}<div class="label daylabel" style="margin-top:10px">Domani</div>${list(addDays(t, 1))}`;
  }

function cardPasti() {

function cardDaFare() {
  const t = today(), tm = addDays(t, 1);
  const rowToday = x => x.deadline
    ? `<div class="item tap" data-act="dl-open" data-id="${esc(x.id)}"><span class="em e">${x.emoji}</span><div class="body"><div class="t">${esc(x.title)}</div></div><span class="pill ${x.late ? "bad" : "warn"}">${x.late ? "scaduto" : "oggi"}</span></div>`
    : checkRow(x.act, x.id, x.done, x.title, x.emoji, x.late ? "in ritardo" : x.meta ? esc(x.meta) : x.min ? x.min + "′" : "", x.late ? "bad" : "");
  const rowTom = x => `<div class="item"><span class="em e">${x.emoji}</span><div class="body"><div class="t">${esc(x.title)}</div></div>${x.min ? `<span class="sub num">${x.min}′</span>` : ""}</div>`;
  const a = todoFor(t);
  const dailyIds = new Set((getDoc("house").tasks || []).filter(y => y.freq === "daily").map(y => y.id));

/* ===================== events (delegation) ===================== */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-tab]");
  if (nav && nav.closest("#nav")) { ui.tab = nav.dataset.tab; if (ui.tab !== "altro") ui.altro = ""; saveUi(); render(); window.scrollTo(0, 0); return; }
  const sg = e.target.closest("[data-seg]");
  if (sg) { ui[sg.dataset.seg] = sg.dataset.val; saveUi(); render(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  ACTIONS[act] && ACTIONS[act](a, id, e);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault(); FORMS[f.dataset.form] && FORMS[f.dataset.form](f);
});
document.addEventListener("input", e => {
  if (e.target.id === "note-q") { ui.noteQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#note-q"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});
$("#fab").onclick = () => openQuickAdd();
document.addEventListener("toggle", e => { const k = e.target?.dataset?.key; if (k) { ui.open[k] = e.target.open; saveUi(); } }, true);

const ACTIONS = {
  goto(a) { ui.tab = a.dataset.tab; if (a.dataset.sub) ui[ui.tab] = a.dataset.sub; saveUi(); render(); window.scrollTo(0, 0); },
  altro(a, id) { ui.altro = id || ""; saveUi(); if (id === "permessi" || id === "impostazioni") refreshPerms(); render(); window.scrollTo(0, 0); },
  "cal-load"() { loadCalendar(false); },
  "cal-refresh"() { loadCalendar(true); },
  async "perm-manage"() { if (!perms) return toast("Gestione permessi non disponibile qui."); try { await perms.manage(); } catch { toast("Apri il menu Autorizzazioni dell'artifact in alto."); } refreshPerms(); },
  "perm-refresh"() { refreshPerms(); },
  "drv-convert"() { driveConvert(); },
  "drv-read"() { driveRead(false); },
  "drv-import"() { driveImport(); },
  "drv-update"() { driveUpdateFile(); },
  // priorità
  "prio-toggle"(a) { const i = +a.dataset.i; mut("priorities", p => { p.items[i].done = !p.items[i].done; }); },
  "prio-del"(a) { const i = +a.dataset.i; const prev = structuredClone(getDoc("priorities")); mut("priorities", p => { p.items.splice(i, 1); }); toast("Priorità eliminata", () => mut("priorities", p => { Object.assign(p, prev); })); },
  "prio-carry"() { const p = getDoc("priorities"); const left = (p.items || []).filter(i => !i.done).slice(0, 3).map(i => ({ text: i.text, done: false })); mut("priorities", d => { d.date = ymd(today()); d.items = left; }); },
  "prio-ai"() { aiPriorities(); },
  // pasti

function addShopping(list) {
  mut("shopping", s => {
    s.items = s.items || [];
    for (const it of list) {
      const ex = s.items.find(x => !x.checked && x.name.toLowerCase() === String(it.name).toLowerCase());
      if (ex) continue;
      s.items.push({ id: newId(), name: String(it.name).slice(0, 80), qty: it.qty ? String(it.qty).slice(0, 40) : "", reparto: REPARTI.includes(it.reparto) ? it.reparto : "Altro", cost: isFinite(+it.cost) && +it.cost > 0 ? +(+it.cost).toFixed(2) : (typeof priceFor === "function" ? priceFor(it.name)?.price ?? null : null), checked: false, src: it.src || "manuale" });
    }

}

async function loadCalendar(refresh) {
  if (!mcp) return;
  cal.status = "loading"; cal.error = ""; schedule();
  try {
    const lc = await mcp.callTool(CAL, "list_calendars", { pageSize: 50 }, { cache: refresh ? { staleTime: 600000, gcTime: 3600000, refresh: true } : { staleTime: 600000, gcTime: 3600000 } });
    const cals = (lc.payload && lc.payload.calendars) || [];
    cal.calendars = cals; cal.claudeId = (cals.find(c => c.summary === CLAUDE_CAL) || {}).id || null;
    const t0 = today(), t2 = addDays(t0, 2);
    const opt = { cache: refresh ? { staleTime: 120000, gcTime: 600000, refresh: true } : { staleTime: 120000, gcTime: 600000 } };
    const res = await Promise.allSettled(cals.map(c => mcp.callTool(CAL, "list_events", { calendarId: c.id, startTime: ymd(t0) + "T00:00:00", endTime: ymd(t2) + "T00:00:00", orderBy: "startTime", pageSize: 100 }, opt)));
    const evs = []; const fails = [];
    res.forEach((r, i) => {
      const c = cals[i];
      if (r.status === "rejected") { fails.push({ c, e: r.reason }); return; }
      for (const ev of (r.value.payload?.events || [])) {
        if (ev.status === "cancelled") continue;
        const allDay = !!ev.start?.date && !ev.start?.dateTime;
        if (allDay) {
          let d = parseD(ev.start.date); const end = ev.end?.date ? parseD(ev.end.date) : addDays(d, 1);
          for (; d < end; d = addDays(d, 1)) if (d >= t0 && d < t2) evs.push({ title: ev.summary || "(senza titolo)", day: d, allDay: true, calName: c.summary === c.id ? "Principale" : c.summary });
        } else if (ev.start?.dateTime) {
          const s = new Date(ev.start.dateTime); const e = ev.end?.dateTime ? new Date(ev.end.dateTime) : null;
          const d = new Date(s); d.setHours(0, 0, 0, 0);
          evs.push({ title: ev.summary || "(senza titolo)", start: s, end: e, day: d < t0 ? t0 : d, allDay: false, calName: c.summary === c.id ? "Principale" : c.summary });
        }
      }
    });
    evs.sort((a, b) => (a.day - b.day) || ((b.allDay ? 1 : 0) - (a.allDay ? 1 : 0)) || ((a.start || 0) - (b.start || 0)));
    if (fails.length && fails.length === cals.length) throw fails[0].e;
    cal.events = evs; cal.status = "ok"; cal.loadedAt = Date.now();
    cal.partial = fails.length ? `Non ho potuto leggere: ${fails.map(f => f.c.summary).join(", ")} (${mcpMsg(fails[0].e)})` : "";
  } catch (e) {
    cal.status = "error"; cal.error = mcpMsg(e);
    if (e?.code === "not_in_manifest") cal.perm = "denied";
  }
  if (perms) perms.state("mcp:" + CAL).then(s => { cal.perm = s; permState.cal = s; }).catch(() => { });
  schedule();
}
async function createCalEvent(ev) {
  if (!mcp) return { ok: false, msg: "Calendario non disponibile in questa vista." };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ev.date || "") || !/^\d{2}:\d{2}$/.test(ev.s || "") || !/^\d{2}:\d{2}$/.test(ev.e || "") || ev.e <= ev.s) return { ok: false, msg: "Data o orario non validi: evento non creato." };
  if (!ev.title) return { ok: false, msg: "Titolo mancante: evento non creato." };
  try {
    if (!cal.claudeId) {
      const lc = await mcp.callTool(CAL, "list_calendars", { pageSize: 50 }, { cache: { staleTime: 600000, gcTime: 3600000 } });
      cal.calendars = lc.payload?.calendars || []; cal.claudeId = (cal.calendars.find(c => c.summary === CLAUDE_CAL) || {}).id || null;
    }
    if (!cal.claudeId) return { ok: false, msg: `Non trovo il calendario "${CLAUDE_CAL}": evento non creato.` };
    const prefix = PREFIXES.includes(ev.prefix) ? ev.prefix : "PERSONALE";
    const summary = `[${prefix}] ${ev.title}`;
    const startMin = (+ev.s.slice(0, 2)) * 60 + (+ev.s.slice(3, 5));
    const rem = prefix === "SCADENZA" ? [{ method: "popup", minutes: 4320 }, { method: "popup", minutes: Math.max(0, startMin - 540) }] : [{ method: "popup", minutes: 30 }];
    const args = { calendarId: cal.claudeId, summary, startTime: `${ev.date}T${ev.s}:00`, endTime: `${ev.date}T${ev.e}:00`, overrideReminders: rem, useDefaultReminders: false };
    if (ev.rrule) args.recurrenceData = [ev.rrule];
    const r = await mcp.callTool(CAL, "create_event", args, { cache: false });
    const created = r.payload && (r.payload.id || r.payload.event?.id || r.payload.htmlLink);
    logAct("📅", "Evento creato: " + summary, { Data: fmtDateY(parseD(ev.date)), Orario: `${ev.s}–${ev.e}`, Ripetizione: ev.rrule ? "ogni settimana" : "no", Calendario: CLAUDE_CAL, Esito: created ? "confermato da Google" : "inviato, senza conferma" });
    if (cal.status === "ok") loadCalendar(true);
    return created ? { ok: true, msg: "Creato in " + CLAUDE_CAL } : { ok: true, unsure: true, msg: "Inviato, ma senza conferma: controlla il calendario." };
  } catch (e) {
    const ambiguous = ["server_unavailable", "upstream_error", "cancelled"].includes(e?.code) || !e?.code;
    return { ok: false, msg: mcpMsg(e) + (ambiguous ? " Potrebbe essere stato creato comunque: controlla il calendario prima di riprovare." : " Evento non creato.") };
  }
}

async function fetchBusy(days) {
  if (!mcp) return null;
  try {
    if (!cal.calendars.length) {
      const lc = await mcp.callTool(CAL, "list_calendars", { pageSize: 50 }, { cache: { staleTime: 600000, gcTime: 3600000 } });
      cal.calendars = lc.payload?.calendars || []; cal.claudeId = (cal.calendars.find(c => c.summary === CLAUDE_CAL) || {}).id || null;
    }
    const t0 = today(), t1 = addDays(t0, days);
    const res = await Promise.allSettled(cal.calendars.map(c => mcp.callTool(CAL, "list_events", { calendarId: c.id, startTime: ymd(t0) + "T00:00:00", endTime: ymd(t1) + "T00:00:00", orderBy: "startTime", pageSize: 100 }, { cache: { staleTime: 120000, gcTime: 600000 } })));
    if (!res.length || res.every(r => r.status === "rejected")) return null;
    const out = [];
    res.forEach(r => {
      if (r.status !== "fulfilled") return;
      for (const ev of r.value.payload?.events || []) {
        if (ev.status === "cancelled") continue;
        if (ev.start?.dateTime) { const a = new Date(ev.start.dateTime), b = ev.end?.dateTime ? new Date(ev.end.dateTime) : null; out.push({ s: a, line: `${DOW_S[dowOf(a)]} ${ymd(a)} ${fmtTime(a)}${b ? "–" + fmtTime(b) : ""} ${ev.summary || ""}` }); }
        else if (ev.start?.date) out.push({ s: parseD(ev.start.date), line: `${DOW_S[dowOf(parseD(ev.start.date))]} ${ev.start.date} tutto il giorno: ${ev.summary || ""}` });
      }
    });
    return out.sort((a, b) => a.s - b.s).map(x => x.line);
  } catch { return null; }
}

async function driveConvert() {
  const c = driveCfg(); if (!c.txtId) return;
  setDrv("Leggo il file di testo dal Drive…", "", "");
  let text, title, parentId = c.parentId;
  try {
    const dl = await mcp.callTool(GD, "download_file_content", { fileId: c.txtId }, { cache: false });
    text = b64ToText(dl.payload?.content || "");
    title = String(dl.payload?.title || c.title || "Dati_Samuele").replace(/\.txt$/i, "");
    if (!text.trim()) throw { code: "tool_error", message: "file vuoto" };
    if (!parentId) { const m = await mcp.callTool(GD, "get_file_metadata", { fileId: c.txtId, excludeContentSnippets: true }, { cache: false }); parentId = m.payload?.parentId || null; }
  } catch (e) { setDrv("", "", "Non riesco a leggere il file: " + gMsg(e, GD)); return; }
  setDrv("Creo il Google Doc nella stessa cartella…");
  let id;
  try {
    const args = { title, textContent: text, contentMimeType: "text/plain" }; if (parentId) args.parentId = parentId;
    const r = await mcp.callTool(GD, "create_file", args, { cache: false });
    id = r.payload?.id || r.payload?.file?.id;
    if (!id) throw { code: "tool_error", message: "nessun id restituito" };
  } catch (e) {
    const amb = ["server_unavailable", "upstream_error", "cancelled"].includes(e?.code) || !e?.code;
    setDrv("", "", "Conversione non riuscita: " + gMsg(e, GD) + (amb ? " Il documento potrebbe essere stato creato comunque: controlla la cartella su Drive prima di riprovare." : "")); return;
  }
  mut("drive", d => { d.docId = id; d.title = title; d.parentId = parentId; d.convertedAt = new Date().toISOString(); });
  setDrv("Verifico il documento creato…");
  try {
    const rd = await docRead(id);
    mut("drivefile", d => { d.text = rd.text; d.readAt = new Date().toISOString(); d.title = rd.title || title; });
    const ok = Math.abs(rd.text.trim().length - text.trim().length) < text.length * 0.05;
    setDrv("", ok ? `Fatto: "${title}" è ora un Google Doc collegato all'app. Il .txt originale è rimasto com'era: puoi spostarlo nel cestino tu quando vuoi.` : "Documento creato, ma il testo letto è diverso in lunghezza dall'originale: aprilo e controlla.", "");
  } catch (e) { setDrv("", "Documento creato e collegato. Non sono riuscito a rileggerlo subito: " + gMsg(e, GDOC), ""); }
}
async function driveRead(silent) {

const PATH_RE = /^[A-Za-z_]+(\[id=[^\]]+\])?$/;
function resolveGet(root, path) {
  let cur = root;
  for (const seg of path.split(".")) { const m = seg.match(/^([A-Za-z_]+)(?:\[id=([^\]]+)\])?$/); if (!m || cur == null) return undefined; cur = cur[m[1]]; if (m[2]) cur = Array.isArray(cur) ? cur.find(x => x && x.id === m[2]) : undefined; }
  return cur;
}
function applyOp(root, op) {
  const segs = String(op.path || "").split(".");
  if (!segs.every(s => PATH_RE.test(s))) throw "percorso non valido";
  if (/\b(paid|history|prevLast|prevNext)\b/.test(op.path)) throw "campo protetto";
  let cur = root;
  for (let i = 0; i < segs.length; i++) {
    const [, key, id] = segs[i].match(/^([A-Za-z_]+)(?:\[id=([^\]]+)\])?$/);
    const last = i === segs.length - 1;
    if (id) {
      const arr = cur[key]; if (!Array.isArray(arr)) throw "elenco non trovato";
      const idx = arr.findIndex(x => x && x.id === id);
      if (last) {
        if (idx < 0) throw "voce non trovata";
        if (op.op === "remove") { arr.splice(idx, 1); return; }
        if (op.op === "set" && op.value && typeof op.value === "object") { arr[idx] = { ...arr[idx], ...op.value, id }; return; }
        throw "operazione non valida";
      }
      if (idx < 0) throw "voce non trovata"; cur = arr[idx];
    } else {
      if (last) {
        if (op.op === "set") { cur[key] = op.value; return; }
        if (op.op === "add") { if (!Array.isArray(cur[key])) cur[key] = []; const v = { ...op.value }; if (!v.id) v.id = newId(); if (cur[key].some(x => x.id === v.id)) v.id += "-" + newId().slice(0, 3); cur[key].push(v); return; }
        if (op.op === "remove") { delete cur[key]; return; }
        throw "operazione non valida";
      }
      if (cur[key] == null || typeof cur[key] !== "object") cur[key] = {};
      cur = cur[key];
    }
  }
}
function short(v) { if (v === undefined) return "—"; const s = typeof v === "string" ? v : JSON.stringify(v); return s.length > 140 ? s.slice(0, 140) + "…" : s; }

async function chatSend(text) {
  if (!sample || chat.busy || !text.trim()) return;
  chat.turns.push({ role: "user", content: text.trim() }); chat.turns.push({ role: "assistant", content: "" });
  chat.busy = true; chat.ctl = new AbortController(); render(); window.scrollTo(0, document.body.scrollHeight);
  const RULES = `Sei l'assistente personale di Samuele dentro la sua app "Gestione Vita". Rispondi in italiano, breve, diretto e pratico, senza frasi motivazionali. Usa i dati qui sotto; se un dato manca dillo, non inventarlo. Distingui stime e ipotesi. Non dare ragione per default: se pianifica troppo o spende oltre il budget, diglielo. Usa al massimo qualche emoji. Non puoi modificare i dati dell'app: se serve, spiega in una riga dove farlo (es. pulsante ＋).
DATI DELL'APP:
${appContext()}`;
  const history = chat.turns.slice(0, -1).slice(-12);
  const input = [{ role: "user", content: RULES }, ...history];
  const last = chat.turns[chat.turns.length - 1];
  try {
    const { text: out } = await sample(input, { signal: chat.ctl.signal, cache: false, onText: ({ text }) => { last.content = text; const el = $("#chat-last"); if (el) el.textContent = text; } });
    last.content = out;
  } catch (e) {
    last.content = (e?.text ? e.text + "\n\n" : "") + (e?.code === "cancelled" ? "⏹️ Interrotto" : "⚠️ " + aiMsg(e));
  } finally { chat.busy = false; chat.ctl = null; render(); setTimeout(() => $("#chat-in")?.focus(), 30); }
}

function priceFor(name) {
  const P = getDoc("prices").items || {}; const k = priceKey(name); if (!k) return null;
  if (P[k]) return P[k];

  for (const [key, v] of Object.entries(P)) { const pk = key.split(" "); if (kw[0] && pk[0] === kw[0] && (!best || v.date > best.date)) best = v; }
  return best;
}

    <textarea class="in" id="kc-note" maxlength="800" style="min-height:96px" placeholder="Es. pasta al pomodoro, 100 g di pasta cruda, 1 cucchiaio d'olio, parmigiano grattugiato. Piatto fondo." ${kc.busy ? "disabled" : ""}>${esc(kc.note)}</textarea></div>
    <div class="grid-chips" style="margin-top:8px">${KC_CHIPS.map(t => `<button type="button" class="gchip" data-act="kc-chip" data-id="${esc(t.replace(/^\S+\s/, ""))}" style="min-height:36px;font-size:13px" ${kc.busy ? "disabled" : ""}>${t}</button>`).join("")}</div>`;
  const photo = kc.img
    ? `<div style="position:relative;margin-top:12px"><img src="${kc.img}" alt="Foto del piatto" style="width:100%;max-height:280px;object-fit:cover;border-radius:16px;display:block">
        ${kc.busy ? "" : `<div class="row" style="position:absolute;right:8px;bottom:8px;gap:6px">
          <label class="btn" style="min-height:40px;padding:0 12px;cursor:pointer;background:var(--surface)">📸<input type="file" id="kc-file" accept="image/*" capture="environment" class="sr"></label>
          <label class="btn" style="min-height:40px;padding:0 12px;cursor:pointer;background:var(--surface)">🖼️ Cambia<input type="file" id="kc-file-g" accept="image/*" class="sr"></label>
          <button class="btn" data-act="kc-clear" style="min-height:40px;padding:0 12px;background:var(--surface)" aria-label="Togli foto">✕</button></div>`}</div>`
    : `<div class="row" style="margin-top:12px;gap:8px;flex-wrap:nowrap"><label class="btn soft" style="flex:1;min-height:64px;font-size:16px;cursor:pointer">📸 Scatta<input type="file" id="kc-file" accept="image/*" capture="environment" class="sr"></label><label class="btn soft" style="flex:1;min-height:64px;font-size:16px;cursor:pointer">🖼️ Galleria<input type="file" id="kc-file-g" accept="image/*" class="sr"></label></div>`;
  const analyze = kc.busy
    ? `<div class="row" style="margin-top:12px"><span class="thinking" style="flex:1"><span class="spinner"></span>Claude analizza con calma… (30–90 s)</span><button class="btn" data-act="kc-stop">⏹️</button></div>`
    : `<button class="btn primary block" data-act="kc-run" style="margin-top:12px;min-height:56px;font-size:17px" ${kc.blob ? "" : "disabled"}>🔍 ${kc.res ? "Analizza di nuovo" : "Analizza"}</button>
       <div class="sub" id="kc-q" style="margin-top:6px">${kcalHint()}</div>`;
  let body = "";
  if (kc.err) body = `<div class="notice err" style="margin-top:12px">${icon("alert", "sm")}<div>${esc(kc.err)}</div></div>`;
  else if (kc.res && !kc.busy) body = kcalResult();
  return card("Calorie da foto", "🔥", `${note}${photo}${analyze}${body}
    <div class="sub" style="margin-top:12px">Solo per te: non viene salvato nulla e non cambia menu, spesa o altro. Sono stime, non sostituiscono un nutrizionista.</div>`);
}
function kcalHint() { if (!kc.blob) return "Scegli una foto, poi premi Analizza."; const q = kcalQuality(); return q.ok ? "🎯 Descrizione completa: puoi puntare ad affidabilità alta." : `💡 Per affidabilità alta aggiungi: ${q.miss.join(", ")}.`; }
function kcalQuality() {
  const t = normTxt(kc.note); const miss = [];
  if (!/\d+\s*(g|gr|grammi|kg|ml)\b|\bgrammi\b|\betto|\bpesat/.test(t)) miss.push("⚖️ grammi degli alimenti principali");
  if (!/olio|burro|senza condimento|niente olio|condiment|strutto|margarina|panna/.test(t)) miss.push("🫒 quanto olio o burro");
  if (!/padella|forno|bollit|lessat|vapore|griglia|piastra|fritt|crud|microonde|cotto|cottura|arrost|stufat/.test(t)) miss.push("🍳 tipo di cottura");
  return { ok: miss.length === 0, miss };
}
function kcalTotals() {
  const it = kc.res.items;
  const sum = k => it.reduce((s, x) => s + (x.on ? (x[k] || 0) * x.g / 100 : 0), 0);
  return { kcal: sum("k100"), p: sum("p100"), c: sum("c100"), f: sum("f100"), g: it.reduce((s, x) => s + (x.on ? x.g : 0), 0) };
}
function kcalResult() {
  const r = kc.res; const T = kcalTotals();
  const lo = Math.round(T.kcal * (1 - r.err) / 10) * 10, hi = Math.round(T.kcal * (1 + r.err) / 10) * 10;
  const conf = { alta: ["ok", "🎯 affidabilità alta"], media: ["warn", "≈ affidabilità media"], bassa: ["bad", "⚠️ affidabilità bassa"] }[r.conf] || ["warn", "≈ stima"];
  const macro = (e, n, v, col) => `<div class="cat" style="align-items:center;text-align:center">${E(e)}<div class="v num">${Math.round(v)} g</div><div class="n">${n}</div><div class="bar" style="width:100%"><span style="width:${Math.min(100, v * (n === "Grassi" ? 9 : 4) / Math.max(1, T.kcal) * 100)}%;background:${col}"></span></div></div>`;
  const qs = r.conf !== "alta" && r.questions.length ? `<div class="card" style="box-shadow:none;background:var(--surface-2);margin-top:12px">
      <div class="t" style="font-weight:800;margin-bottom:8px">🎯 Per arrivare ad affidabilità alta rispondi:</div>
      <div class="form" style="gap:10px">${r.questions.map((qq, i) => `<div class="field"><label for="kc-a${i}">${esc(qq)}</label><input class="in" id="kc-a${i}" data-ka="${i}" value="${esc(kc.ans[i] || "")}" maxlength="120"></div>`).join("")}
      <button class="btn primary block" data-act="kc-answer">🔄 Ricalcola con le risposte</button></div></div>` : "";
  return `<div style="margin-top:14px">
    <div class="row between" style="align-items:flex-start"><div style="min-width:0"><div class="sec-title">${esc(r.dish)}</div><div class="sub">${Math.round(T.g)} g in totale</div></div><span class="pill ${conf[0]}">${conf[1]}</span></div>
    <div style="text-align:center;margin:14px 0 6px"><div class="big num" style="font-size:48px;color:var(--sec)">${Math.round(T.kcal)}</div><div class="sub">kcal · probabile tra ${lo} e ${hi}</div></div>
    <div class="cats" style="grid-template-columns:repeat(3,minmax(0,1fr))">${macro("💪", "Proteine", T.p, "var(--c-oggi)")}${macro("🍚", "Carboidrati", T.c, "var(--warn)")}${macro("🫒", "Grassi", T.f, "var(--c-pasti)")}</div>
    ${qs}
    <div class="label daylabel" style="margin-top:14px">Alimenti nel piatto</div>
    <div class="list">${r.items.map((x, i) => `<div class="item ${x.on ? "" : "done"}" style="flex-wrap:wrap;gap:8px 12px">
      <button class="chk" role="checkbox" aria-checked="${x.on}" aria-label="Conta ${esc(x.name)}" data-act="kc-on" data-id="${i}">${icon("check")}</button>
      <span class="em e">${E(emo("food", x.name, "🍽️"))}</span>
      <div class="body"><div class="t">${esc(x.name)}</div><div class="s">${Math.round(x.k100)} kcal/100 g${x.hidden ? " · nascosto" : ""}${x.fromUser ? " · dalla tua descrizione" : ""}</div></div>
      <div class="row" style="gap:4px;flex-wrap:nowrap"><input class="in num" data-kg="${i}" type="number" inputmode="numeric" min="0" max="3000" step="5" value="${Math.round(x.g)}" aria-label="Grammi di ${esc(x.name)}" style="width:78px;min-height:40px;text-align:right;padding:6px 8px"><span class="sub">g</span></div>
      <span class="num" style="font-weight:800;min-width:66px;text-align:right" data-kk="${i}">${x.on ? Math.round(x.k100 * x.g / 100) : 0} kcal</span></div>`).join("")}</div>
    ${r.notes ? `<div class="notice info" style="margin-top:10px">${icon("info", "sm")}<div>${esc(r.notes)}</div></div>` : ""}
    <div class="sub" style="margin-top:8px">✏️ Se sai il peso vero di un alimento correggilo: il totale si aggiorna subito.</div></div>`;
}
function kcalDownscale(file) {
  return new Promise(resolve => {
    try {
      const url = URL.createObjectURL(file); const im = new Image();
      im.onload = () => { try { const s = Math.min(1, 1568 / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); const prev = c.toDataURL("image/jpeg", .82); c.toBlob(b => { URL.revokeObjectURL(url); resolve({ blob: b || file, prev }); }, "image/jpeg", .9); } catch { resolve({ blob: file, prev: null }); } };
      im.onerror = () => { URL.revokeObjectURL(url); resolve({ blob: file, prev: null }); };
      im.src = url;
    } catch { resolve({ blob: file, prev: null }); }
  });
}
async function kcalLoad(file) {
  kc.err = ""; kc.res = null; kc.ans = {};
  const d = await kcalDownscale(file); kc.blob = d.blob; kc.img = d.prev || ""; render();
}
async function kcalAnalyze() {
  if (!sample || !kc.blob || kc.busy) return;
  const caps = await sample.limits().catch(() => null);
  if (!caps?.images) { kc.err = "L'invio di foto a Claude non è disponibile in questa vista."; render(); return; }
  kc.note = ($("#kc-note")?.value ?? kc.note).trim(); kc.busy = true; kc.err = ""; render();
  kc.ctl = new AbortController();
  const prompt = `Sei un nutrizionista esperto nella stima delle porzioni da foto. Il tuo obiettivo è una stima il più vicina possibile al reale.
${kc.note ? `DESCRIZIONE DELL'UTENTE (fonte più affidabile della foto: grammi, olio, cottura e ingredienti indicati vanno usati esattamente così; dalla foto stima solo ciò che manca): «${kc.note}»` : "Nessuna descrizione: stima tutto dalla foto."}
Metodo, passo per passo:
1. Riconosci il piatto e ogni alimento distinto. Aggiungi i condimenti probabili non visibili (olio di cottura o a crudo, burro, sughi, formaggio) segnandoli "nascosto": true, salvo che la descrizione dica che non ci sono.
2. Per ogni alimento non pesato dall'utente stima i grammi così come sono nel piatto (cotto se cotto), usando riferimenti di scala: piatto piano ~26 cm, fondo ~22 cm, posate (forchetta ~19 cm), mani, bicchieri; ragiona su area × spessore × densità. Se l'utente indica un peso a crudo (pasta, riso, carne), converti nel peso cotto (pasta ×2,2–2,5; riso ×2,5–3; carne −25%) oppure usa direttamente i valori a crudo, in modo coerente.
3. Usa valori per 100 g da tabelle CREA/USDA nello stato corretto (crudo o cotto).
4. Incertezza: 5–10% se i pesi principali e l'olio sono dati dall'utente; 10–20% se la foto è chiara e il piatto semplice; 20–35% altrimenti. Affidabilità "alta" solo se incertezza ≤ 12%.
5. Se l'affidabilità non è alta, scrivi fino a 3 domande brevi e precise che la renderebbero alta (es. "Quanti grammi di pasta, crudi?", "Quanto olio hai usato?").
Rispondi SOLO con JSON:
{"piatto":"nome breve in italiano","alimenti":[{"nome":"","grammi":0,"kcal_100g":0,"proteine_100g":0,"carboidrati_100g":0,"grassi_100g":0,"nascosto":false,"da_descrizione":false}],"incertezza_pct":15,"affidabilita":"alta|media|bassa","domande":["…"],"note":"una riga su cosa ha pesato di più nella stima"}
Se nell'immagine non c'è cibo: {"piatto":null,"alimenti":[]}.`;
  try {
    const r = await sample.json(prompt, { images: kc.blob, signal: kc.ctl.signal, cache: false, modelTier: "complex", effort: "high" });
    const items = (Array.isArray(r?.alimenti) ? r.alimenti : []).filter(x => x && x.nome && +x.grammi > 0 && +x.kcal_100g >= 0).slice(0, 20)
      .map(x => ({ name: String(x.nome).slice(0, 60), g: Math.min(3000, +x.grammi), k100: Math.min(900, +x.kcal_100g || 0), p100: +x.proteine_100g || 0, c100: +x.carboidrati_100g || 0, f100: +x.grassi_100g || 0, hidden: !!x.nascosto, fromUser: !!x.da_descrizione, on: true }));
    if (!r?.piatto || !items.length) { kc.err = "Non riconosco cibo nella foto: cambia foto inquadrando il piatto dall'alto."; kc.res = null; }
    else {
      const err = Math.min(.5, Math.max(.05, (+r.incertezza_pct || 20) / 100));
      let conf = String(r.affidabilita || "").toLowerCase(); if (!["alta", "media", "bassa"].includes(conf)) conf = err <= .12 ? "alta" : err <= .22 ? "media" : "bassa";
      kc.res = { dish: String(r.piatto).slice(0, 60), items, err, conf, questions: (Array.isArray(r.domande) ? r.domande : []).map(String).filter(Boolean).slice(0, 3), notes: String(r.note || "").slice(0, 240) };
      kc.ans = {};
    }
  } catch (e) {
    if (e?.code !== "cancelled") kc.err = e?.code === "image_rejected" ? "Foto non accettata: cambia foto (JPG o PNG)." : aiMsg(e);
  } finally { kc.busy = false; kc.ctl = null; render(); }
}
Object.assign(ACTIONS, {
  "kc-run"() { kcalAnalyze(); },
  "kc-stop"() { kc.ctl?.abort(); },
  "kc-clear"() { kc.blob = null; kc.img = null; kc.res = null; kc.err = ""; kc.ans = {}; render(); },
  "kc-answer"() {
    const qs = kc.res?.questions || []; const add = qs.map((q, i) => (kc.ans[i] || "").trim() ? `${q.replace(/\?\s*$/, "")}: ${kc.ans[i].trim()}` : "").filter(Boolean);
    if (!add.length) { toast("Scrivi almeno una risposta"); return; }
    kc.note = [kc.note.replace(/[.,;]\s*$/, ""), ...add].filter(Boolean).join(". "); kcalAnalyze();
  },
  "kc-chip"(a, id) { const ta = $("#kc-note"); const cur = (ta?.value ?? kc.note).trim(); kc.note = cur ? (cur.replace(/[.,;]\s*$/, "") + ", " + id) : id.charAt(0).toUpperCase() + id.slice(1); render(); const n = $("#kc-note"); if (n) { try { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } catch { } } },
  "kc-on"(a, id) { const x = kc.res?.items[+id]; if (x) { x.on = !x.on; render(); } },
});
document.addEventListener("change", e => { if ((e.target.id === "kc-file" || e.target.id === "kc-file-g") && e.target.files?.[0]) { const f = e.target.files[0]; e.target.value = ""; kcalLoad(f); } });
document.addEventListener("input", e => {
  if (e.target?.id === "kc-note") { kc.note = e.target.value; const h = document.getElementById("kc-q"); if (h) h.textContent = kcalHint(); return; }
  if (e.target?.dataset?.ka != null) { kc.ans[+e.target.dataset.ka] = e.target.value; return; }
  const i = e.target?.dataset?.kg; if (i == null || !kc.res) return;
  const x = kc.res.items[+i]; x.g = Math.max(0, Math.min(3000, +e.target.value || 0));
  const kk = document.querySelector(`[data-kk="${i}"]`); if (kk) kk.textContent = (x.on ? Math.round(x.k100 * x.g / 100) : 0) + " kcal";
  clearTimeout(kc.t); kc.t = setTimeout(() => { const el = document.activeElement; const pos = el?.dataset?.kg; render(); if (pos != null) { const n = document.querySelector(`[data-kg="${pos}"]`); if (n) { try { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } catch { } } } }, 700);
});

/* ===================== boot ===================== */
function loadLocal() {
  try { const idx = JSON.parse(localStorage.getItem("gv:index") || "[]"); for (const id of idx) { const v = localStorage.getItem("gv:" + id); if (v) store.docs[id] = JSON.parse(v); } } catch { }
}
async function boot() {
  render();
  const C = window.claude;
  if (!C || typeof C.use !== "function") { store.mode = "local"; loadLocal(); store.loaded = true; render(); return; }
  C.use("permissions").then(p => { perms = p; refreshPerms(); }).catch(() => { });
  C.use("downloads").then(d => { downloads = d; }).catch(() => { });
  C.use("mcp").then(async m => {
    mcp = m; schedule(); if (!m) return;
    let st = "prompt";
    try { const p = perms || await C.use("permissions"); if (p) st = await p.state("mcp:" + CAL); } catch { }
    cal.perm = st;
    if (st === "granted") loadCalendar(false); else schedule();
  }).catch(() => { });
  try {
    const [d, u] = await Promise.all([C.use("db"), C.use("user")]);
    db = d; userId = u ? await u.id() : null;
    if (!db || !userId) { store.mode = "local"; loadLocal(); store.loaded = true; render(); return; }
    col = db.collection("data/users/" + userId);
    store.mode = "db";
    let first = true;
    col.onSnapshot(snap => {
      for (const doc of snap.docs) { if (!writing[doc.id] && !pendingBody[doc.id]) store.docs[doc.id] = doc.data(); }
      if (first && !snap.metadata.fromCache) first = false;
      store.loaded = true; schedule();
    }, err => {
      store.err = dbMsg(err); store.loaded = true; schedule();
    });
    setTimeout(() => { if (!store.loaded) { store.loaded = true; schedule(); } }, 8000);
  } catch {
    store.mode = "local"; loadLocal(); store.loaded = true; render();
  }
}
// aggiorna saluto/data a cambio giorno o ritorno in primo piano
document.addEventListener("visibilitychange", () => { if (!document.hidden) schedule(); });
setInterval(() => schedule(), 60000);
boot();
</script>
